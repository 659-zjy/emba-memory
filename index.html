/* ---------- 轮次计划 ---------- */
function renderPlan(){
  const v = $('#view-plan');
  const ri = roundInfo();
  const totalDays = Math.ceil(liveCards().length / state.config.dailyNew);
  const rows = [];
  const today = todayStr();
  const unlearned = unlearnedIds().length;
  for(let d = 1; d <= Math.min(totalDays, 60); d++){
    const date = addDays(state.start, d-1);
    const r = Math.ceil(d/5), day = ((d-1)%5)+1;
    if(dayDiff(today, date) < -20 && day > 1) continue; // 只展示从当前轮开始的近期
    const reviews = [];
    liveCards().forEach(c => {
      const cr = rec(c.id);
      if(cr.learned){
        cr.ivs.forEach((iv,i)=>{
          if(addDays(cr.learned, iv) === date) reviews.push({iv});
        });
      }
    });
    const remain = Math.max(0, liveCards().length - (d-1)*state.config.dailyNew);
    const newN = d <= totalDays ? Math.min(state.config.dailyNew, remain) : 0;
    const isToday = date === today;
    rows.push({d, date, r, day, newN, reviews, isToday});
  }
  // 按轮次分组
  const rounds = {};
  rows.forEach(row => { if(!rounds[row.r]) rounds[row.r] = []; rounds[row.r].push(row); });
  let html = '<div class="section-head"><h2>轮次计划</h2><p>每 5 天为一轮：每天学 '+state.config.dailyNew+' 张新卡，并复习当天到期的内容（学习后第 '+state.config.intervals.join('/')+' 天各复习一次）。</p></div>';
  const rk = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  html += rk.map(r => {
    const rs = rounds[r];
    const isCur = r === ri.round;
    let table = '<table class="plan-table"><thead><tr><th>日期</th><th>第几天</th><th>新卡</th><th>到期复习</th></tr></thead><tbody>';
    rs.forEach(row => {
      const rv = row.reviews.length
        ? row.reviews.map(x => '<span class="rhythm" style="display:inline-flex"><span>第'+x.iv+'天复习</span></span>').join(' ')
        : '<span style="color:var(--ink-soft)">—</span>';
      table += '<tr class="'+(row.isToday?'today-row':'')+'"><td class="day-num">'+row.date+'</td><td>第 '+row.day+' 天</td>'
        + '<td>'+(row.newN ? row.newN+' 张' : '—')+'</td><td>'+rv+'</td></tr>';
    });
    table += '</tbody></table>';
    return '<div class="plan-round"><div class="pr-head">第 '+r+' 轮 · 第 '+(r*5-4)+'–'+(r*5)+' 天'
      + (isCur ? '<span class="current">当前进行中</span>' : '')
      + '</div>'+table+'</div>';
  }).join('');
  v.innerHTML = html;
}

    const l = state.log[d] || {learn:0, review:0};
    days.push({d, learn:l.learn, review:l.review, total:l.learn+l.review});
  }

  + '<div class="panel" style="margin-top:18px"><h3 style="margin-bottom:16px">各章节学习进度</h3><div class="chap-prog">'+chap+'</div></div>';

  + '<div class="set-row"><div class="s-label"><b>解析与导入</b><p>先「解析预览」确认能识别多少道，确认无误再「确认导入」。</p></div>'
  + '<button class="btn btn-line" onclick="importPreview()">解析预览</button>'
  + '<button class="btn btn-main" onclick="confirmImportQuestions()">确认导入</button></div>'
  + '<div id="import-q-preview" style="font-size:12.5px;color:var(--ink-soft);margin-top:6px"></div>'
  + '</div>';
}
function exportData(){
  const box = $('#export-box');
  const full = exportRaw();
  box.style.display = 'block';
  box.innerHTML = '<textarea id="export-ta" rows="4" readonly style="width:100%;box-sizing:border-box;font-size:12px;font-family:monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink)">'+full+'</textarea>'
    + '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">'
    + '<button class="btn btn-main" onclick="copyExport()">复制文本</button>'
    + '<button class="btn btn-line" onclick="downloadExport()">下载为文件</button>'
    + '</div>';
}
function exportRaw(){ return 'EBA1:' + encodeURIComponent(JSON.stringify(state)); }
function copyExport(){
  const ta = $('#export-ta');
  ta.select();
  try{ navigator.clipboard.writeText(ta.value); toast('已复制，发送到另一台设备即可'); return; }catch(e){}
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('请长按文本框手动复制'); }
}
function downloadExport(){
  const blob = new Blob([$('#export-ta').value], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'emba-backup-'+todayStr()+'.txt';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 300);
}
function importData(){
  const box = $('#import-box');
  box.style.display = 'block';
  box.innerHTML = '<textarea id="import-ta" rows="4" placeholder="在此粘贴导出的进度文本" style="width:100%;box-sizing:border-box;font-size:12px;font-family:monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink)"></textarea>'
    + '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">'
    + '<button class="btn btn-main" onclick="applyImport()">应用导入</button>'
    + '<label class="btn btn-line" style="cursor:pointer;display:inline-flex;align-items:center">选择文件<input type="file" accept=".txt,.json,text/plain,application/json" style="display:none" onchange="readImportFile(event)"></label>'
    + '</div>';
}
function applyImport(){
  const v = $('#import-ta').value.trim();
  if(!v){ toast('请先粘贴进度文本'); return; }
  const s = parseBackup(v);
  if(!s){ toast('进度文本无效，请确认完整粘贴'); return; }
  state = s;
  applyCustomCards();
  saveState(); renderTop(); route(); ghAutoPush();
  toast('导入成功');
}
function readImportFile(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const s = parseBackup(String(r.result).trim());
    if(!s){ toast('文件内容无效'); return; }
    state = s;
    applyCustomCards();
    saveState(); renderTop(); route(); ghAutoPush();
    toast('导入成功');
  };
  r.readAsText(f, 'utf-8');
}
function parseBackup(text){
  try{
    let data = text;
    if(data.indexOf('EBA1:') === 0) data = data.slice(5);
    const obj = JSON.parse(decodeURIComponent(data));
    if(obj && obj.v === 1 && obj.start && obj.config && obj.config.intervals && obj.cards && obj.log){ if(!Array.isArray(obj.custom)) obj.custom = []; if(!obj.overrides || typeof obj.overrides !== 'object') obj.overrides = {}; if(!Array.isArray(obj.deleted)) obj.deleted = []; return obj; }
  }catch(e){}
  return null;
}

/* ---------- 自定义题目导入 ---------- */
function applyCustomCards(){
  const custom = (state.custom||[]).filter(c => c && c.id && c.q && c.a && !CARDS.some(x => x.id === c.id));
  if(custom.length) CARDS.push(...custom);
}
function parseQuestions(text){
  const out = [];
  const t = String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(!t.trim()) return out;
  // 方式1：标题式 ## Q: xxx / ### Q：xxx
  const blocks = t.split(/^#{1,6}\s*[Q问][题]?\s*[:：]\s*/m);
  if(blocks.length > 1){
    for(let i=1;i<blocks.length;i++){
      const lines = blocks[i].split('\n');
      const q = lines[0].trim();
      const a = lines.slice(1).join('\n').trim();
      if(q && a) out.push({q, a});
    }
    if(out.length) return out;
  }
  // 方式2：Q: ... / A: ... 成对
  const lines2 = t.split('\n');
  let curQ = null, curA = [];
  for(const ln of lines2){
    const s = ln.trim();
    if(!s) continue;
    const mq = s.match(/^[Q问][题]?\s*[:：]\s*(.+)$/);
    const ma = s.match(/^[A答][案]?\s*[:：]\s*(.+)$/);
    if(mq){ if(curQ && curA.length) out.push({q:curQ, a:curA.join('\n').trim()}); curQ = mq[1].trim(); curA = []; }
    else if(ma && curQ){ curA.push(ma[1].trim()); }
    else if(curQ){ curA.push(s); }
  }
  if(curQ && curA.length) out.push({q:curQ, a:curA.join('\n').trim()});
  return out.filter(x => x.q && x.a);
}
function importPreview(){
  const items = parseQuestions($('#import-q-ta').value.trim());
  const box = $('#import-q-preview');
  if(!items.length){ box.textContent = '未识别到题目，请检查格式（参考上方示例）。'; return; }
  box.innerHTML = '识别到 <b>'+items.length+'</b> 道题：<ul style="margin:6px 0 0 16px;line-height:1.8">'
    + items.slice(0, 6).map(x => '<li>'+esc(x.q.slice(0, 40))+(x.q.length>40?'…':'')+'</li>').join('')
    + (items.length > 6 ? '<li>…等共 '+items.length+' 道</li>' : '') + '</ul>';
}
function confirmImportQuestions(){
  const text = ($('#import-q-ta').value||'').trim();
  const items = parseQuestions(text);
  if(!items.length){ toast('未识别到题目，请检查格式'); return; }
  let added = 0, dup = 0;
  items.forEach(it => {
    if(CARDS.some(c => c.q === it.q)){ dup++; return; }
    const nextId = CARDS.reduce((m, c) => Math.max(m, c.id), 0) + 1;
    state.custom.push({ id: nextId, ch: 13, q: it.q, a: it.a });
    CARDS.push({ id: nextId, ch: 13, q: it.q, a: it.a });
    added++;
  });
  if(added){ saveState(); renderTop(); route(); ghAutoPush(); }
  toast('已导入 '+added+' 道，跳过重复 '+dup+' 道');
  $('#import-q-preview').textContent = added ? '导入完成，可在「题库浏览 · 自定义题库」查看，并已自动上传云端。' : '没有新增题目。';
  $('#import-q-ta').value = '';
}
function handleImportFile(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const name = (f.name||'').toLowerCase();
  if(name.endsWith('.pdf') || f.type === 'application/pdf'){ readPdfFile(f); return; }
  const r = new FileReader();
  r.onload = () => { $('#import-q-ta').value = String(r.result); toast('已读取文件，点「解析预览」查看'); };
  r.onerror = () => toast('文件读取失败');
  r.readAsText(f, 'utf-8');
}
function readPdfFile(file){
  const r = new FileReader();
  r.onload = () => {
    if(!window.pdfjsLib){ toast('PDF 解析库未加载（请确认网络可用）'); return; }
    pdfjsLib.getDocument({ data: r.result }).promise
      .then(pdf => {
        const parts = [];
        for(let i = 1; i <= pdf.numPages; i++){
          parts.push(pdf.getPage(i).then(p => p.getTextContent()).then(tc => tc.items.map(it => it.str).join(' ')));
        }
        return Promise.all(parts);
      })
      .then(lines => { $('#import-q-ta').value = lines.join('\n\n'); toast('PDF 文字已提取，点「解析预览」查看'); })
      .catch(e => toast('PDF 解析失败：'+e.message));
  };
  r.onerror = () => toast('文件读取失败');
  r.readAsArrayBuffer(file);
}

/* ---------- GitHub Gist 云同步 ---------- */
const GH_KEYS = { t:'eba_gh_token', g:'eba_gh_gist', a:'eba_gh_auto', ts:'eba_gh_ts' };
function ghGet(k){ try{ return localStorage.getItem(GH_KEYS[k]); }catch(e){ return null; } }
function ghSet(k, v){ try{ localStorage.setItem(GH_KEYS[k], v); }catch(e){} }
function ghToken(){ return ghGet('t') || ''; }
function ghAutoOn(){ return ghGet('a') === '1'; }
function ghLastSync(){ return ghGet('ts') || ''; }
function ghHeaders(){
  return { 'Authorization':'token '+ghToken(), 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
}
function ghStatusMsg(msg){ const el = document.getElementById('gh-status'); if(el) el.textContent = msg; }
function ghSaveToken(){
  const t = ($('#gh-token').value||'').trim();
  if(!t){ toast('请先粘贴令牌'); return; }
  ghSet('t', t);
  toast('令牌已保存');
  ghTest();
}
function ghTest(){
  const t = ghToken();
  if(!t){ toast('请先保存令牌'); return; }
  ghStatusMsg('正在连接 GitHub…');
  fetch('https://api.github.com/user', { headers: ghHeaders() })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(u => { ghStatusMsg('连接成功：'+(u.login||'')+(ghLastSync() ? '；上次同步 '+ghLastSync() : '')); toast('GitHub 连接成功'); })
    .catch(e => { ghStatusMsg('连接失败：'+e.message+'（令牌无效或网络异常）'); toast('连接失败'); });
}
function ghPush(){
  const t = ghToken();
  if(!t){ toast('请先保存令牌'); return; }
  const content = JSON.stringify(state);
  const gid = ghGet('g');
  ghStatusMsg('正在上传进度…');
  const url = gid ? ('https://api.github.com/gists/'+gid) : 'https://api.github.com/gists';
  const method = gid ? 'PATCH' : 'POST';
  const body = gid
    ? { files:{ 'eba-progress.json':{ content } } }
    : { description:'嵌入式八股 · 艾宾浩斯记忆进度', public:false, files:{ 'eba-progress.json':{ content } } };
  fetch(url, { method, headers: ghHeaders(), body: JSON.stringify(body) })
    .then(g => { if(g.id) ghSet('g', g.id); const now = new Date().toLocaleString('zh-CN'); ghSet('ts', now); ghStatusMsg('上传成功；上次同步 '+now); toast('进度已上传到云端'); })
    .catch(e => { ghStatusMsg('上传失败：'+e.message); toast('上传失败，请检查令牌与网络'); });
}
function ghPull(){
  const t = ghToken(), gid = ghGet('g');
  if(!t){ toast('请先保存令牌'); return; }
  if(!gid){ toast('云端还没有进度（请先在一台设备上传）'); return; }
  ghStatusMsg('正在拉取进度…');
  fetch('https://api.github.com/gists/'+gid, { headers: ghHeaders() })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(g => {
      const f = g.files && g.files['eba-progress.json'];
      if(!f || !f.content) throw new Error('云端文件缺失');
      let s;
      try{ s = JSON.parse(f.content); }catch(e){ throw new Error('云端数据无法解析'); }
      if(!s || s.v !== 1) throw new Error('云端数据格式无效');
      if(!Array.isArray(s.custom)) s.custom = [];
      if(!s.overrides || typeof s.overrides !== 'object') s.overrides = {};
      if(!Array.isArray(s.deleted)) s.deleted = [];
      state = s;
      applyCustomCards();
      saveState(); renderTop(); route();
      const now = new Date().toLocaleString('zh-CN'); ghSet('ts', now);
      ghStatusMsg('拉取成功；上次同步 '+now);
      toast('已从云端恢复进度');
    })
    .catch(e => { ghStatusMsg('拉取失败：'+e.message); });
}
let ghTimer = null;
function ghAutoPush(){
  if(!ghAutoOn() || !ghToken()) return;
  clearTimeout(ghTimer);
  ghTimer = setTimeout(() => { ghPush(); }, 2000);
}
function ghAutoPull(){
  if(!ghAutoOn() || !ghToken() || !ghGet('g')) return;
  setTimeout(() => { ghPull(); }, 1200);
}
function ghToggleAuto(on){
  ghSet('a', on ? '1' : '0');
  toast(on ? '自动同步已开启' : '自动同步已关闭');
  if(on && ghToken()) ghPush();
}
function saveSettings(){
  const n = parseInt($('#set-new').value, 10);
  const ivs = $('#set-iv').value.split(/[,，\s]+/).map(x => parseInt(x, 10)).filter(x => x > 0 && x < 100);
  if(!n || n < 1){ toast('每天新卡数需为不小于 1 的整数'); return; }
  if(!ivs.length){ toast('复习间隔格式有误'); return; }
  state.config.dailyNew = n;
  state.config.intervals = ivs;
  saveState(); renderTop(); renderSettings(); ghAutoPush();
  toast('设置已保存');
}
function resetAll(){
  if(confirm('确定清空全部学习记录吗？将回到第 1 轮第 1 天重新开始。已导入的自定义题目和答案修改会保留。此操作不可恢复。')){
    state = Object.assign(defaultState(), { custom: (state.custom||[]).slice(), overrides: (state.overrides||{}), deleted: (state.deleted||[]).slice() });
    try{ saveState(); }catch(e){}
    renderTop(); route(); ghAutoPush();
    toast('已重置全部学习记录');
  }
}

/* =========================================================
   初始化
   ========================================================= */
function init(){
  state = loadState();
  applyCustomCards();
  renderTop();
  window.addEventListener('hashchange', route);
  $('#hamburger').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
  $('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
  route();
  ghAutoPull();
}
window.CARDS = CARDS;
init();
</script>
